name: "NodeSeek → Seekly"
description: "点开 NodeSeek 帖子链接时直接在 Seekly 中打开（seekly://post/<id>），Seekly 自身请求不受影响。"
author: "Ethan2258"
homepage: "https://github.com/Ethan2258/egern-seekly"
manual: "https://github.com/Ethan2258/egern-seekly#readme"
icon: "arrow.up.forward.app"
open_url: "seekly://"
compat_arguments:
  MODE: "redirect"
compat_arguments_desc: "MODE：redirect = 直接 302 跳转到 Seekly（默认）；page = 跳转页（自动打开 Seekly，并保留「继续在浏览器中查看」按钮）"
# Safari 等浏览器会对 Cloudflare 站点走 HTTP/3（QUIC），MITM 解不开 QUIC，
# 脚本就收不到请求。只对 nodeseek.com 拒绝 QUIC，浏览器会自动退回 HTTPS（TCP）。
rules:
  - and:
      match:
        - domain_suffix:
            match: "nodeseek.com"
        - protocol:
            match: "quic"
      policy: REJECT
scriptings:
  - http_request:
      name: "NodeSeek 帖子跳转 Seekly"
      match: "^https?://(www\\.)?nodeseek\\.com/post-\\d+"
      script_url: "https://raw.githubusercontent.com/Ethan2258/egern-seekly/main/seekly-open.js"
      timeout: 10
      env:
        MODE: "{{{MODE}}}"
mitm:
  hostnames:
    - "nodeseek.com"
    - "www.nodeseek.com"
