name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 脚本语法，以及 seekly.yaml 的匹配规则、脚本地址、MITM 主机、默认 MODE 和脚本 / README 是否一致。
      - name: Check module
        run: npm run check

      - name: Test request script
        run: npm test
